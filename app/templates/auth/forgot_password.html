{% extends 'base.html' %}
{% block title %}Forgot password — ShareCircle{% endblock %}
{% block content %}
<section class="auth-shell"><div class="auth-card"><span class="eyebrow">ACCOUNT ACCESS</span><h1 data-i18n="auth.forgot_title">Forgot your password?</h1><p class="muted" data-i18n="auth.forgot_copy">Enter your account email. ShareCircle will show the next available recovery step.</p><form method="post" class="form-stack" novalidate><label><span data-i18n="auth.email">Email</span><input name="email" type="email" autocomplete="email" required aria-describedby="forgotEmailError"><small id="forgotEmailError" class="field-error"></small></label><button class="btn btn-primary btn-large" type="submit" data-i18n="auth.forgot_submit">Request reset</button></form><p class="auth-switch"><a href="{{ url_for('auth.login') }}" data-i18n="auth.back_login">Back to log in</a></p></div></section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/forms.js') }}" defer></script>{% endblock %}
